[project]
name = "loom"
version = "0.1.0"
description = "Loom — a dynamic heterogeneous AI task orchestrator"
requires-python = ">=3.10"
dependencies = ["ortools>=9.9", "anthropic>=0.40", "streamlit>=1.38"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
